[project]
name = "autotest-e2e"
version = "0.1.0"
description = "End-to-end test project for QA Course App"
requires-python = ">=3.12,<4.0"
dependencies = [
    "httpx>=0.28.1,<0.29",
    "loguru>=0.7.3,<0.8",
    "playwright>=1.62,<2",
    "pytest>=9.1.1,<10",
    "pytest-playwright>=0.9,<0.10",
    "pydantic[email] (>=2.13.5,<3)",
    "allure-pytest (>=2.16.2,<3)",
    "pydantic-settings (>=2.15,<3)",
    "jsonschema (>=4.26,<5)",
    "faker (>=40.40.0,<41.0.0)",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1,<3",
    "ruff>=0.16.8,<0.17",
    "types-jsonschema (>=4.26,<5)",
]

[tool.poetry]
package-mode = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not unit'"
markers = [
    "unit: isolated tests for infrastructure components",
    "e2e: cross-layer integration tests",
    "courses: course, cover, and exercise workflows",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
files = ["."]
strict = true
pretty = true
exclude_gitignore = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["tests.*", "fixtures.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_untyped_decorators = false
check_untyped_defs = true
