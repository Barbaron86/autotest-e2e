[project]
name = "autotest-e2e"
version = "0.1.0"
description = "End-to-end test project for QA Course App"
requires-python = ">=3.12,<4.0"
dependencies = [
    "httpx>=0.28.1,<0.29",
    "loguru>=0.7.3,<0.8",
    "playwright>=1.62,<2",
    "pytest>=9.1.1,<10",
    "pytest-playwright>=0.9,<0.10",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1,<3",
    "ruff>=0.16.8,<0.17",
]

[tool.poetry]
package-mode = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
